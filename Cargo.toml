[package]
name = "ledger"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"        # Para o hashing SHA-256 (Camada de Dados)
serde = { version = "1.0", features = ["derive"] } # Para transformar structs em bytes
serde_json = "1.0"   # Para facilitar a visualização/hashing
chrono = "0.4"       # Para o timestamp dos blocos
ed25519-dalek = { version = "1.0.1", features = ["rand"] } # Para assinaturas digitais (Segurança/Identidade)
rand = "0.8"
hex = "0.4.3"
dirs = "4.0"
base64 = "0.21"
getrandom = "0.2"
schnorrkel = "0.11" # VRF (Verifiable Random Function) para PoS
tokio = { version = "1.35", features = ["full"] }
libp2p = { version = "0.52.4", features = ["tokio", "tcp", "noise", "yamux", "kad", "ping", "gossipsub", "macros", "request-response", "json"] }
axum = "0.7"
reqwest = { version = "0.11", features = ["json"] }
dotenvy = "0.15"
async-trait = "0.1"

